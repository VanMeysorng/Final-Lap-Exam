# Pod 1: API Gateway + Registration (2 containers in the same pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-registration
  template:
    metadata:
      labels:
        app: gateway-registration
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: REGISTRATION_URL
              value: "http://localhost:3001"
            - name: SEARCH_URL
              value: "http://search-service:3002"
        - name: registration-service
          image: registration-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URL
              value: "mongodb://host.minikube.internal:27017/studentdb"
---
# Pod 2: Search microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search-service
          image: search-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: MONGO_URL
              value: "mongodb://host.minikube.internal:27017/studentdb"
