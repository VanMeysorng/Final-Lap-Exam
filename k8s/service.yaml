# Public entry point: API Gateway (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
# Internal: Search service (only reachable inside the cluster, via the gateway)
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  type: ClusterIP
  selector:
    app: search
  ports:
    - port: 3002
      targetPort: 3002
